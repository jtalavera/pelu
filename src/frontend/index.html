<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Same key and default as useTheme (light unless the user chose dark): avoids a flash of the
      // wrong theme before React mounts. The OS color-scheme preference is intentionally ignored.
      (function () {
        try {
          if (localStorage.getItem("femme-theme") === "dark")
            document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0E767E" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/flowbit-app-icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/flowbit-app-icon-180.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <title>Flowbit</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
