spring.application.name=backend

# RT-21 (Hardening_SIFEN.md): correlationId/tenantId are set in MDC by CorrelationIdFilter (request
# threads) and SifenSubmissionQueueListener (the Service Bus consumer thread) — visible in every
# log line without each call site formatting them manually.
logging.pattern.level=%5p [${spring.application.name:},%X{correlationId:-},%X{tenantId:-}]

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# spring-boot-starter-actuator is on the classpath for Micrometer (RT-21), not for the container's
# own health probes, which are TCP (see infrastructure_v2/main.tf) and never hit this endpoint.
# Nothing beyond health is exposed, and it still sits behind Spring Security's default
# .anyRequest().authenticated() like every other endpoint.
management.endpoints.web.exposure.include=health

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:sqlserver://localhost:1433;databaseName=service_app_db;encrypt=false;trustServerCertificate=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:service_app}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:The.S3cr3t.2026}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# Azure SQL is serverless with auto-pause (backend_min_replicas=0 lets the DB go idle too).
# A cold deploy's first connection can hit "Database ... is not currently available" while it
# resumes (usually <1 min, occasionally longer) — without retries Flyway throws immediately,
# Spring's context refresh fails, and the JVM exits, crash-looping the container. Retry instead.
spring.flyway.connect-retries=30
spring.flyway.connect-retries-interval=5s
# Never edit an already-applied migration: it changes the Flyway checksum and validation aborts startup.
# Fix forward with a new V<n> migration instead. (`spring.flyway.repair-on-migrate` is not a real property.)
# If Hibernate reports missing tables after Flyway: ensure SQL Server has service_app_db + service_app login,
# and that flyway_schema_history matches reality (e.g. if V1 was applied but tables were dropped, repair or clear history).

# Optional; Azure Container Apps sets APP_FRONTEND_URL to the CORS-allowed frontend origin(s) for CORS.
# Comma-separated to allow multiple origins (e.g. the Static Web App default host plus custom domains).
app.frontend.url=${APP_FRONTEND_URL:http://localhost:5173}

app.femme.business-zone-id=${APP_FEMME_BUSINESS_ZONE:America/Asuncion}
# RT-18 (Hardening_SIFEN.md): no default here on purpose — outside the e2e profile this is
# resolved from Azure Key Vault at boot by KeyVaultSecretsEnvironmentPostProcessor, never from an
# env var or a hardcoded fallback. See application-e2e.properties for the e2e-only literal value.
app.femme.jwt.access-token-ttl-seconds=${FEMME_JWT_TTL_SECONDS:28800}

# System operator (not the same as tenant admin). For FK, the user is stored on a tenant row; JWT tenant id = this value.
app.femme.system-admin.email=root@pelu
app.femme.system-admin.tenant-id=1
app.femme.email.enabled=${ACS_ENABLED:true}
app.femme.email.connection-string=${ACS_CONNECTION_STRING:}
app.femme.email.sender-address=${ACS_SENDER_ADDRESS:}

# RT-12/RT-18: Azure Key Vault, used both for per-tenant SIFEN certificate secrets and for the app
# JWT secret. Real URI + enabled=true come from Terraform-injected env vars in every non-e2e
# deployment; app.femme.keyvault.enabled=false in application-e2e.properties/application-test.properties
# opts out (RT-08) to local/literal storage instead.
app.femme.keyvault.enabled=${FEMME_KEYVAULT_ENABLED:true}
app.femme.keyvault.uri=${FEMME_KEYVAULT_URI:}

# RT-20: Azure Service Bus (Basic tier) — asynchronous SIFEN transmission. Real
# namespace/queue + enabled=true come from Terraform-injected env vars in every non-e2e
# deployment; app.femme.servicebus.enabled=false in application-e2e.properties/
# application-test.properties opts out (RT-08) to an in-process async queue instead.
app.femme.servicebus.enabled=${FEMME_SERVICEBUS_ENABLED:true}
app.femme.servicebus.namespace=${FEMME_SERVICEBUS_NAMESPACE:}
app.femme.servicebus.queue=${FEMME_SERVICEBUS_QUEUE:sifen-submission}

# SIFEN: which environment to connect to (HU-05 AC-04) — switch via FEMME_SIFEN_ENVIRONMENT only, never code.
# Base URLs are the real addresses from the technical manual (section 7.10); do not change casually.
app.femme.sifen.connection.environment=${FEMME_SIFEN_ENVIRONMENT:TEST}
app.femme.sifen.connection.test-base-url=${FEMME_SIFEN_TEST_BASE_URL:https://sifen-test.set.gov.py}
app.femme.sifen.connection.production-base-url=${FEMME_SIFEN_PRODUCTION_BASE_URL:https://sifen.set.gov.py}
