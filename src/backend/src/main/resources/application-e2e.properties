# Playwright / local e2e: in-memory H2 with MSSQL compatibility mode.
# Same logical DB name, username and password as the default SQL Server datasource (application.properties).
# Flyway SQL migrations target SQL Server; for H2 we rely on JPA schema generation (same approach as src/test).
spring.datasource.url=jdbc:h2:mem:service_app_db;MODE=MSSQLServer;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=service_app
spring.datasource.password=The.S3cr3t.2026
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=false

# Stable JWT for local e2e runs (not for production).
app.femme.jwt.secret=e2e-jwt-secret-min-32-characters-long!!

# RT-08/RT-12: e2e never depends on a real Key Vault or an emulator — SIFEN certificate material
# stays local (LocalFileSifenCertificateSecretStore) and the JWT secret above is used verbatim.
app.femme.keyvault.enabled=false

# RT-08/RT-20: e2e never depends on a real Service Bus or an emulator either — transmit attempts
# run through LocalAsyncSifenSubmissionQueue (genuinely async, single background thread) instead.
app.femme.servicebus.enabled=false

# Disable real email sending in e2e — activation links are logged to console instead.
app.femme.email.enabled=false

# Re-enable the platform-config seed runner (feature flags, tiers — see FemmeDataInitializer) and
# the SeedResetService "/api/admin/seed/reset" endpoint for e2e only. HU-56 removed the CSV
# catalog/client reconciliation that used to run at boot; HU-58 went further and removed
# FemmeDataInitializer's creation of a demo tenant/admin user entirely — the e2e suite now
# provisions its own tenant + admin dynamically via the real Platform Admin API instead (see
# e2e/global-setup.ts). What's left for this flag to gate is just tiers/flags (platform
# configuration, not a tenant's business data) plus the reset endpoint, which is still an
# unauthenticated bulk-delete-and-reseed-login of tenant id=1 that must stay off in production. e2e
# always boots against a fresh, empty in-memory H2 database (ddl-auto=create-drop above), so
# neither risk applies here. NOTE: the platform admin (below) is bootstrapped independently of
# this flag — see PlatformAdminBootstrap (HU-57).
femme.data-init.enabled=true

# HU-57: e2e always boots a fresh, empty H2 database, so PlatformAdminBootstrap creates this user
# on every run. Explicit here (a test/e2e properties file, not application code) rather than a
# default in FemmePlatformAdminProperties — these exact values mirror
# e2e/fixtures/auth.ts PLATFORM_ADMIN_EMAIL / PLATFORM_ADMIN_PASSWORD.
app.femme.platform-admin.email=platform-admin@pelu
app.femme.platform-admin.password=.The.Platform@admin.2026

# SIFEN HU-07: point the "test" environment at an unreachable local port instead of the real
# sifen-test.set.gov.py. Playwright must never depend on a live network call to a real external
# government server (flaky, possibly blocked in CI) — port 9 ("discard") reliably refuses the
# connection immediately, which SifenDocumentQueryClient/SifenDocumentReceptionClient already treat
# as "no response" (a real, documented SIFEN failure mode, not a test hack around the parsing).
app.femme.sifen.connection.test-base-url=https://127.0.0.1:9
