spring.datasource.url=jdbc:h2:mem:femme_test;MODE=MSSQLServer;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

spring.flyway.enabled=false

app.femme.jwt.secret=test-jwt-secret-min-32-characters-long!!
app.femme.jwt.access-token-ttl-seconds=28800

# RT-08/RT-12: no real Key Vault in unit/integration tests either.
app.femme.keyvault.enabled=false

# RT-08/RT-20: no real Service Bus in unit/integration tests either.
app.femme.servicebus.enabled=false

# Stock integration: no outbound calls in unit/integration tests.
app.femme.stock.enabled=false
app.femme.stock.sso.secret=test-stock-sso-secret-min-32-characters-long!!
app.femme.stock.integration.client-secret=test-integration-client-secret
app.femme.stock.integration.token-secret=test-integration-token-secret-min-32-characters!!

# Conversational assistant: tests never call Foundry (see ScriptedAssistantModelClient).
app.femme.assistant.model=fake

# WhatsApp: tests never reach Meta (see FakeWhatsAppGateway).
app.femme.whatsapp.enabled=true
app.femme.whatsapp.provider=fake
app.femme.whatsapp.app-secret=test-whatsapp-app-secret
app.femme.whatsapp.webhook-verify-token=test-whatsapp-verify-token

# WhatsApp background jobs (sweep of due/retry messages, retention) never run on their own in tests:
# the tests drive them explicitly. A periodic query would otherwise add SQL statements to the ones
# other tests count (e.g. AppointmentRepositoryFindInRangeFilteredTest asserts Hibernate's global
# prepared-statement count) and make them flaky.
app.femme.whatsapp.sweep-initial-delay-ms=3600000
app.femme.whatsapp.sweep-delay-ms=3600000
app.femme.whatsapp.retention-cron=-

# HU-WAP-04: booking notices over WhatsApp are ON in tests (the per-salon switch of RSV-02 does not
# exist yet; in production it defaults to OFF).
app.femme.whatsapp.booking-notices-enabled=true
