# T2 (docs/staging-env.md): a prod sizing change without the matching staging change fails the PR.
# Also formats/validates the Terraform root module (no backend, no Azure credentials needed).
name: Staging parity

on:
  pull_request:
    paths:
      - "infrastructure_v2/**"
      - "scripts/staging/**"
      - ".github/workflows/staging-parity.yml"
  push:
    branches: [develop, main]
    paths:
      - "infrastructure_v2/**"
      - "scripts/staging/**"

permissions:
  contents: read

jobs:
  parity:
    name: Staging ↔ prod tfvars parity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Parity guard self-test
        run: bash scripts/staging/test-parity.sh

      - name: Parity check (prod vs staging tfvars)
        run: bash scripts/staging/check-parity.sh

      - name: Shell syntax (scripts/staging)
        run: |
          set -euo pipefail
          for f in scripts/staging/*.sh; do bash -n "$f"; done
          shellcheck -x -S warning scripts/staging/*.sh

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_wrapper: false

      - name: terraform fmt
        working-directory: infrastructure_v2
        run: terraform fmt -check -recursive -diff

      - name: terraform validate
        working-directory: infrastructure_v2
        run: |
          terraform init -backend=false -input=false
          terraform validate
